<header class="site-header">
  <div class="hdr-bar">
    <a class="hdr-logo" href="/" aria-label="UNIT.BALI VILLAS"><b>UNIT.</b>BALI VILLAS</a>

    <nav class="hdr-deal" aria-label="Deal type">
      <a class="hdr-deal-link<!--BUY_ON-->" href="/">Buy</a>
      <span class="hdr-deal-link is-soon" aria-disabled="true">Rent <small>soon</small></span>
    </nav>

    <div class="hdr-actions">
      <button type="button" class="hdr-text-btn hdr-assistant">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5v-3.5H5A1.5 1.5 0 0 1 3.5 15V7A1.5 1.5 0 0 1 5 5.5Z"/></svg>
        Assistant
      </button>

      <div class="hdr-pop">
        <button type="button" class="hdr-text-btn hdr-lang" aria-haspopup="menu" aria-expanded="false" aria-label="Language">
          EN
          <svg class="hdr-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
        </button>
        <div class="hdr-menu hdr-menu-lang" role="menu" hidden>
          <button type="button" role="menuitemradio" aria-checked="true" data-lang="en">English</button>
          <button type="button" role="menuitemradio" aria-checked="false" data-lang="ru">Русский</button>
        </div>
      </div>

      <div class="hdr-icons">
        <a class="hdr-icon" href="/favorites" aria-label="Favorites">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.35-7-10a4.1 4.1 0 0 1 7-2.15A4.1 4.1 0 0 1 19 10c0 5.65-7 10-7 10Z"/></svg>
        </a>
        <a class="hdr-icon" href="/cabinet/leads" aria-label="Requests<!--LEADS_LABEL-->">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4.5 7.5 7.5 6 7.5-6"/></svg>
          <!--LEADS_BADGE-->
        </a>
        <button type="button" class="hdr-icon" aria-label="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10a6 6 0 1 1 12 0c0 4 1.4 5.5 1.4 5.5H4.6S6 14 6 10Z"/><path d="M10 18.5a2 2 0 0 0 4 0"/></svg>
        </button>
      </div>

      <a class="hdr-cta" href="<!--CTA_HREF-->">List a&nbsp;property</a>

      <!--ACCOUNT-->

      <button type="button" class="hdr-burger" aria-expanded="false" aria-controls="hdr-sheet" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
  <!--SUB-->
</header>

<div class="hdr-sheet" id="hdr-sheet" role="dialog" aria-modal="true" aria-label="Menu" hidden>
  <div class="hdr-sheet-top">
    <a class="hdr-logo" href="/"><b>UNIT.</b>BALI VILLAS</a>
    <button type="button" class="hdr-icon hdr-sheet-close" aria-label="Close menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="hdr-sheet-body">
    <div class="hdr-sheet-deal">
      <a class="hdr-deal-link is-on" href="/">Buy</a>
      <span class="hdr-deal-link is-soon" aria-disabled="true">Rent <small>soon</small></span>
    </div>
    <nav class="hdr-sheet-nav" aria-label="Catalog sections">
      <a href="/catalog?construction_status=off_plan&amp;limit=60">New builds</a>
      <a href="/catalog?property_type=villa&amp;limit=60">Villas</a>
      <a href="/catalog?property_type=apartment&amp;limit=60">Apartments</a>
      <a href="/catalog?property_type=house&amp;limit=60">Houses</a>
      <a href="/catalog?property_type=land&amp;limit=60">Land</a>
      <a href="/commercial">Commercial</a>
      <a href="/services">Services</a>
    </nav>
    <div class="hdr-sheet-tools">
      <a href="/favorites">Favorites</a>
      <a href="/cabinet/leads">Requests</a>
      <button type="button">Assistant</button>
      <div class="hdr-sheet-lang" role="group" aria-label="Language">
        <button type="button" aria-pressed="true" data-lang="en">EN</button>
        <button type="button" aria-pressed="false" data-lang="ru">RU</button>
      </div>
    </div>
  </div>
  <a class="hdr-cta hdr-sheet-cta" href="<!--CTA_HREF-->">List a&nbsp;property</a>
</div>
